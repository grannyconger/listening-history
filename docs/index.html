<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listening History</title>
  <meta name="description" content="A personal Spotify listening history explorer, 2015 to today.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232a78d6'/%3E%3Cpath d='M9 12c5-1.5 10-1 14 1.5M10 16.5c4-1 8-.6 11 1.2M11 20.6c3-.6 6-.3 8 .9' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { const t = localStorage.getItem('lh-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Listening History</a>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="controls">
      <label class="switch" title="Hide plays matched by your exclusion rules (classroom music, novelty songs…)">
        <input type="checkbox" id="personal" checked>
        <span>Personal only</span>
      </label>
      <button id="rulesBtn" class="btn ghost" type="button">Exclusions</button>
      <label class="sr-only" for="yearSel">Year filter</label>
      <select id="yearSel" class="select" aria-label="Year filter"></select>
      <button id="themeBtn" class="btn ghost icon" type="button" aria-label="Toggle dark mode">◐</button>
    </div>
  </header>
  <main id="view" tabindex="-1"><div class="loading">Loading your listening history…</div></main>
  <div id="tip" class="tip" role="tooltip" hidden></div>

  <dialog id="rulesDlg" class="dialog">
    <form method="dialog">
      <h2>Exclusion rules</h2>
      <p class="muted">When <strong>Personal only</strong> is on, plays matching any checked rule are left out of every chart, list and total. Defaults come from <code>config/exclusions.json</code>; your changes here are saved in this browser.</p>
      <div id="rulesList"></div>
      <div class="dlg-actions">
        <button type="button" id="rulesReset" class="btn ghost">Reset to defaults</button>
        <button class="btn">Done</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
