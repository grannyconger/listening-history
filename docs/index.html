<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listening History</title>
  <meta name="description" content="Ten years of Spotify listening, told one year at a time.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232a78d6'/%3E%3Cpath d='M12 9.5v13l11-6.5z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { const t = localStorage.getItem('lh-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/story">Listening History</a>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="search" role="search">
      <label class="sr-only" for="search">Find a song or artist</label>
      <input id="search" type="search" placeholder="Find a song or artist" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="searchResults" aria-autocomplete="list">
      <div id="searchResults" class="search-results" role="listbox" hidden></div>
    </div>
    <button id="filtersBtn" class="btn ghost" type="button" aria-expanded="false" aria-controls="filters">What counts</button>
    <button id="themeBtn" class="btn ghost icon" type="button" aria-label="Switch light or dark">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
    </button>
  </header>
  <section id="filters" class="filters" hidden aria-label="What counts">
    <div class="filters-inner">
      <h2>What counts as your listening</h2>
      <p class="muted">Turned-on filters leave plays out of every list, chart and total. Your choices are saved in this browser.</p>
      <div id="filtersBody"></div>
    </div>
  </section>
  <main id="view" tabindex="-1"><p class="loading">Loading your listening history</p></main>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <aside id="player" class="player" hidden aria-label="Player">
    <div id="playerMount" class="player-mount"></div>
    <button id="playerClose" class="btn ghost icon" type="button" aria-label="Close player">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </aside>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="app.js"></script>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</body>
</html>
